<title>Thank You | The Performance Marketer</title>
<meta name="description" content="Thanks for reaching out to The Performance Marketer. We've received your request and will be in touch within one working day.">

<style>
:root{--ink:#14122b;--sun:#ffd23f;--pink:#ff5c8a;--mint:#b8f0d8;--w:#fff}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);line-height:1.6;background:var(--w)}
h1{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.1;letter-spacing:-.02em}
a{color:inherit}:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--w)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.1rem;text-decoration:none;display:flex;align-items:center}
.btn{display:inline-block;background:var(--pink);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:14px 30px;font:700 1rem 'DM Sans';text-decoration:none;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:.15s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
main{background:var(--sun);min-height:calc(100vh - 64px);display:flex;align-items:center}
.card{max-width:640px;margin:0 auto;padding:64px 24px;text-align:center}
.tick{width:88px;height:88px;border-radius:50%;background:var(--ink);display:grid;place-items:center;margin:0 auto 28px}
.tick svg{width:44px;height:44px}
main h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:800;margin-bottom:16px}
main p{font-size:1.15rem;font-weight:500;margin-bottom:10px}
main .sub{color:#4a4866;font-weight:500;margin-bottom:36px}
.actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn.ghost{background:var(--w)}
@media(max-width:600px){.actions{flex-direction:column;align-items:stretch}}
</style></head><body>

<nav><div class="wrap"><a class="logo" href="index.html"><img src="brand/logo-horizontal-dark.png" width="131" height="32" alt="The Performance Marketer" style="height:32px;width:auto;display:block"></a></div></nav>

<main><div class="card">
<div class="tick"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#ffd23f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<h1>Thanks, that's in!</h1>
<p>We've received your request.</p>
<p class="sub">One of us will get back to you within one working day.</p>
<div class="actions">
<a class="btn" href="index.html">Back to home</a>
</div>
</div></main>
